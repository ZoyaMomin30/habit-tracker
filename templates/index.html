<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container">
        <img id="header_image" src="{{ url_for('static', filename='images/headerimage.png') }}" alt="logo" height="250px" >
    </div>


    <div class="container">
        <div class="left">

            <iframe 
                src="https://widgetbox.app/embed/clock/digital/9659d62d-ae0e-497d-9c06-f787fd578d30" 
                width="270" 
                height="300" 
                frameborder="0" 
                scrolling="no">
            </iframe>

            <img class="image" src="{{ url_for('static', filename='images/image1.png') }}" alt="logo" height="250px" >
            <img class="image" src="{{ url_for('static', filename='images/image2.png') }}" alt="logo" height="350px" >
            <img class="image" src="{{ url_for('static', filename='images/image3.png') }}" alt="logo" height="350px" >

        </div>

        <div class="center">
            <h1 id="title">Habit Tracker</h1>

            <div class="quote-container">
                <p>"{{ quote_text }}"</p>
                <p class="author">- {{ author }}</p>
            </div>

            <!-- Initial Habit Creation Form (shown by default) -->

            {% if not habit_created %}
                <!-- Show form only if no habit exists -->
                <form id="habitForm" action="/add_habit" method="POST" class="habit-form">
                    <div class="form-group">
                        <label for="habit">Habit:</label>
                        <input type="text" name="habit" id="habit" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Daily Target:</label>
                        <input type="number" name="quantity" id="quantity" step="0.1" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-dark">Create Habit</button>
                </form>
                {% else %}
                <!-- Show tracking interface -->
                <div class="tracking-interface">
                    <h3>Tracking: {{ habit_name }}</h3>
                    <p>Daily Target: {{ target }}</p>
                    
                    <form action="/submit" method="POST" class="pixel-form">
                        <input type="number" name="quantity" step="0.1" min="0" 
                            max="{{ '24' if 'hour' in target.lower() else '100' }}" required>
                        <button type="submit">Add Progress</button>
                    </form>
                    
                    <iframe src="https://pixe.la/v1/users/{{ USERNAME }}/graphs/{{ graph_id }}" 
                            width="100%" height="300"></iframe>
                </div>
                {% endif %}


            <iframe src="https://pixe.la/v1/users/zoya1/graphs/graph2" 
                 width="800" height="400" frameborder="0">
            </iframe>

            <h2>{{habit}}</h2>
            

            <div class="modification-buttons">


                <!-- Pixel Tracking Form (hidden by default) -->
            <div id="pixelFormContainer" style="display: none;">
                <h3 id="habitTitle" class="habit-title"></h3>
                <form action="/submit" method="POST" class="pixel-form">
                    <div class="form-group">
                        <label for="pixelQuantity">{{habit}}</label>
                        <input type="number" 
                            id="pixelQuantity" 
                            name="quantity" 
                            class="pixel-input"
                            min="0" 
                            max="24" 
                            required
                            placeholder="{{quantity}}">
                    </div>
                    <button type="submit" class="pixel-submit-btn">Add Pixel</button>
                </form>
            </div>


                <!-- ADDDD PIXELLLLL BUTTONNN -->

                <!-- <form action="/submit" method="POST" class="pixel-form">
                    <div class="form-group">
                        <label for="quantity">{{habit}}</label>
                        <input type="number" 
                               id="quantity" 
                               name="quantity" 
                               class="pixel-input"
                               min="0" 
                               max="24" 
                               required
                               placeholder="{{quantity}}">
                    </div>
                    <button type="submit" class="pixel-submit-btn">Add Pixel</button>
                </form> -->

                <!-- Pixel Tracking Form (hidden by default) -->
                 






                <button type="button" class="btn btn-dark"> update Pixel</button>
                <button type="button" class="btn btn-dark"> delete Pixel</button>

            </div>
        </div>
            

        <div class="right">
            <iframe 
                src="https://widgetbox.app/embed/calendar/simple/86a2e937-8939-4821-b633-228db2dc300b" 
                width="300" 
                height="300" 
                frameborder="0" 
                scrolling="no">
            </iframe>



            <img class="image" src="{{ url_for('static', filename='images/image5.png') }}" alt="logo" height="350px" >
            <img class="image" src="{{ url_for('static', filename='images/image4.png') }}" alt="logo" height="250px" >

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
